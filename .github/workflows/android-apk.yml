name: Build HOTSET Browser Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      
      - name: Build Android APK
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "dev.hotset.browser",
            "appName": "HOTSET Browser",
            "webDir": "src"
          }
          EOF
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
                    npx cap add android
          npx cap sync android
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
              EOF
              
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOTSET-Browser-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
